name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  serveur:
    name: Tests du serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Tests du mode réseau privé (client)
        run: |
          cp server/hub.js client/hub.js
          NODE_PATH=server/node_modules node client/test/direct.test.js

  bout-en-bout:
    name: Test de bout en bout (Chromium, WebRTC)
    runs-on: ubuntu-latest
    needs: serveur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - run: python3 client/test/e2e.py
